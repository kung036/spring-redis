# local ??
spring:
  application:
    name: spring-redis
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://localhost:3306/redisdb
    username: ${LOCAL_MYSQL_USERNAME}
    password: ${LOCAL_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true